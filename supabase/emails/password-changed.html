<!-- Supabase › Authentication › Emails › Password changed
     Subject: הסיסמה שלך בתורנו שונתה -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px">
      <tr><td dir="rtl" style="background:#ffffff;border-radius:16px;padding:32px 28px;text-align:right;color:#1c1c1e">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px"><tr>
          <td style="padding:0;vertical-align:middle"><img src="https://tornu.co.il/email/logo.png" width="32" height="32" alt="" style="display:block;border:0;width:32px;height:32px"></td>
          <td style="width:10px"></td>
          <td style="padding:0;vertical-align:middle;font-size:17px;font-weight:700;color:#1c1c1e">תורנו</td>
        </tr></table>
        <h1 style="font-size:22px;line-height:1.3;margin:0 0 8px;font-weight:700;color:#1c1c1e">הסיסמה שונתה</h1>
        <p style="font-size:15px;line-height:1.6;margin:0 0 20px;color:#3a3a3c">הסיסמה של החשבון <span dir="ltr">{{ .Email }}</span> שונתה עכשיו.</p>
        <p style="font-size:13px;line-height:1.6;margin:0;color:#86868b">לא שינית את הסיסמה? כדאי לאפס את הסיסמה עכשיו ולפנות אלינו. <a href="{{ .SiteURL }}/reset-password" style="color:#1c1c1e">לאיפוס הסיסמה</a></p>
      </td></tr>
      <tr><td dir="ltr" style="padding:16px 0 0;font-size:12px;line-height:1.6;color:#86868b;text-align:center">Your Tornu password was changed.</td></tr>
    </table>
  </td></tr>
</table>
