  <tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px">
      <tr><td dir="rtl" style="background:#ffffff;border-radius:16px;padding:32px 28px;text-align:right;color:#1c1c1e">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px"><tr><td style="background:#1c1c1e;border-radius:12px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:12px">כניסה לחשבון</a></td></tr></table>

      </td></tr>
      <tr><td dir="ltr" style="padding:16px 0 0;font-size:12px;line-height:1.6;color:#86868b;text-align:center">Your Tornu sign-in code: {{ .Token }}</td></tr>
