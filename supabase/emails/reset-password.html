<!-- Supabase › Authentication › Emails › Reset Password.
     Subject: קוד איפוס הסיסמה שלך בתורנו: {{ .Token }} -->
<div dir="rtl" lang="he" style="background:#f5f5f7;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#1c1c1e">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px 28px;text-align:right">
    <div style="font-size:17px;font-weight:700;margin:0 0 24px">תורנו</div>
    <h1 style="font-size:22px;line-height:1.3;margin:0 0 8px;font-weight:700">איפוס סיסמה</h1>
    <p style="font-size:15px;line-height:1.6;margin:0 0 24px;color:#3a3a3c">זה הקוד לאיפוס הסיסמה שלך. מקלידים אותו בדף האיפוס, והוא תקף לשעה.</p>
    <div dir="ltr" style="font-size:32px;letter-spacing:8px;font-weight:700;text-align:center;background:#f5f5f7;border-radius:12px;padding:18px 0;margin:0 0 24px;font-family:'SF Mono',Menlo,Consolas,monospace">{{ .Token }}</div>
    <p style="font-size:13px;line-height:1.6;margin:0;color:#86868b">לא ביקשת לאפס סיסמה? אפשר להתעלם מהמייל הזה. הסיסמה שלך לא תשתנה.</p>
  </div>
  <p dir="ltr" style="max-width:440px;margin:16px auto 0;font-size:12px;line-height:1.6;color:#86868b;text-align:center">Your Tornu password reset code: {{ .Token }}</p>
</div>
