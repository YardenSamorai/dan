# Builds the iPhone app on a Mac and uploads it to TestFlight.
# Run it from GitHub: Actions → iOS app → Run workflow.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   APPLE_TEAM_ID   – the 10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID      – App Store Connect API key ID (Users and Access → Integrations, role Admin)
#   ASC_ISSUER_ID   – the issuer ID shown on that page
#   ASC_KEY_P8      – the contents of the downloaded AuthKey_….p8 file
# Variables (same page → Variables): the public VITE_* settings of the site's build.
name: iOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version people see in the App Store (e.g. 1.0)
        required: true
        default: '1.0'

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://tornu.co.il' }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_MESSAGE_ALLOWANCE: ${{ vars.VITE_MESSAGE_ALLOWANCE }}
      VITE_USD_ILS: ${{ vars.VITE_USD_ILS }}
      VITE_LEGAL_COMPANY: ${{ vars.VITE_LEGAL_COMPANY }}
      VITE_LEGAL_COMPANY_ID: ${{ vars.VITE_LEGAL_COMPANY_ID }}
      VITE_LEGAL_ADDRESS: ${{ vars.VITE_LEGAL_ADDRESS }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      VITE_VIDEO_WELCOME: ${{ vars.VITE_VIDEO_WELCOME }}
      VITE_VIDEO_PAGE: ${{ vars.VITE_VIDEO_PAGE }}
      VITE_VIDEO_PHOTOS: ${{ vars.VITE_VIDEO_PHOTOS }}
      VITE_VIDEO_TEAM: ${{ vars.VITE_VIDEO_TEAM }}
      VITE_VIDEO_PUBLISH: ${{ vars.VITE_VIDEO_PUBLISH }}
      VITE_VIDEO_CALENDAR: ${{ vars.VITE_VIDEO_CALENDAR }}
      VITE_VIDEO_SHARE: ${{ vars.VITE_VIDEO_SHARE }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app into the iOS project
        run: npm run app:build

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
